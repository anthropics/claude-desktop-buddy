name: Web Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e m5stickc-plus

      - name: Merge firmware into a single flashable binary
        run: |
          BUILD_DIR=.pio/build/m5stickc-plus
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
            -name boot_app0.bin | head -n1)
          mkdir -p site
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 merge_bin \
            -o site/firmware.bin \
            --flash_mode keep --flash_freq keep --flash_size 4MB \
            0x1000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: Assemble site
        run: |
          cp web/index.html site/index.html
          VERSION="${GITHUB_SHA::7}"
          sed "s/{{VERSION}}/$VERSION/" web/manifest.json > site/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
