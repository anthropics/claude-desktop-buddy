; Claude Desktop Buddy — M5Stack StickS3 port
; Based on plus2 fork (M5Unified migration) + StickS3 official PlatformIO config
[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_M5STACK_STICKS3
build_src_filter = +<main.cpp> +<buddy.cpp> +<buddies/> +<ble_bridge.cpp> +<character.cpp>
lib_deps =
    m5stack/M5Unified @ ^0.2.14
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/AnimatedGIF @ ^2.1.1
    m5stack/M5PM1
